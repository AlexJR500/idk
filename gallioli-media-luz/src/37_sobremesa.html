<section class="sobremesa" id="sobremesa" aria-labelledby="sob-h">
  <div class="rig" aria-hidden="true">
    <div class="rig-in">
      <i class="cord rig-cord"></i>
      {{LAMP rig-lamp}}
      <div class="cone rig-cone"></div>
      <div class="pool rig-pool"></div>
    </div>
  </div>

  <div class="wrap sob-in">
    <header class="sob-head">
      <h2 id="sob-h" class="h2 rv-focus">De sobremesa</h2>
      <p class="sob-score rv" style="--i:1">4,8 de 5 en Google, con 745 reseñas.</p>
    </header>

    <div class="quotes">
      <figure class="q rv" data-q="0">
        <blockquote><p>«Una experiencia deliciosa de principio a fin. Un ambiente encantador y acogedor, con una decoración impecable y hermosas plantas naturales.»</p></blockquote>
        <figcaption>Anna S.&nbsp;· Local Guide&nbsp;· hace 5 meses</figcaption>
      </figure>
      <figure class="q rv" data-q="1">
        <blockquote><p>«Os recomiendo las croquetas y las bravas, y si os va el picante, las alitas.»</p></blockquote>
        <figcaption>Resumen de reseñas&nbsp;· Google Maps</figcaption>
      </figure>
      <figure class="q rv" data-q="2">
        <blockquote><p>«Hemos ido a encargar cena para llevar y en 15 minutos ya teníamos todo preparado y listo para recoger.»</p></blockquote>
        <figcaption>Laura Ferrer&nbsp;· Local Guide&nbsp;· hace 9 meses</figcaption>
      </figure>
      <figure class="q rv" data-q="3">
        <blockquote><p>«Muy rico todo, las patatas de boniato riquísimas y la hamburguesa espectacular.»</p></blockquote>
        <figcaption>Resumen de reseñas&nbsp;· Google Maps</figcaption>
      </figure>
      <figure class="q rv" data-q="4">
        <blockquote><p>«La comida es buenísima, la salsa del pollo frito es muy rica.»</p></blockquote>
        <figcaption>Resumen de reseñas&nbsp;· Google Maps</figcaption>
      </figure>
    </div>

    <div class="sob-foot rv">
      <p class="sob-close">Lo más nombrado: las <a class="tlink js-call" href="#plato-croquetas">croquetas</a>, el <a class="tlink js-call" href="#plato-boniato">boniato</a>, el <a class="tlink js-call" href="#plato-fried">fried chicken</a> y el <a class="tlink js-call" href="#plato-canelon">canelón</a>.</p>
      <p class="sob-google"><a class="tlink" href="{{MAPS}}" target="_blank" rel="noopener">Ver reseñas en Google{{NE}}{{NEW}}</a></p>
      <p class="small">Opiniones tomadas de reseñas públicas en Google.</p>
    </div>
  </div>
</section>
