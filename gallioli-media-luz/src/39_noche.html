<section class="noche" id="esta-noche" aria-labelledby="noche-h">
  <div class="noche-img" aria-hidden="true">
    <div class="pool noche-pool"></div>
    <div class="cone noche-cone"></div>
    <div class="haze-host noche-haze"></div>
    <i class="cord noche-cord"></i>
    <span class="bulb-halo noche-halo"></span>
    {{LAMP noche-lamp}}
  </div>
  <div class="wrap g12 noche-in">
    <div class="noche-body">
      <h2 id="noche-h" class="noche-h">Tu mesa, esta noche.</h2>
      <p class="noche-live rv" data-noche-live aria-live="off"><span data-nl-st>12:30–16:00&nbsp;· 20:00–23:00</span><span class="nl-sep" hidden>&nbsp;· </span><span class="nl-cd" data-nl-cd></span></p>
      <div class="noche-act">
        {{RESERVA esta-noche}}
        <p class="noche-tel rv">o llama al {{TEL}} {{COPY}}</p>
      </div>
    </div>
  </div>
</section>
